<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天買什麼幣 - 多時框強勢突破選股</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 自動重新整理 (每 2 分鐘刷新一次前端) -->
    <meta http-equiv="refresh" content="120">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🚀</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">
                    今天買什麼幣
                </h1>
            </div>
            <div id="update-time" class="text-xs sm:text-sm text-slate-400">
                更新時間：載入中...
            </div>
        </div>
    </header>

    <!-- 主體內容區塊 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 說明橫幅 -->
        <div class="mb-8 p-4 rounded-xl bg-slate-800/60 border border-slate-700/50 text-sm text-slate-300">
            <div class="font-semibold text-slate-200 mb-1">💡 策略過濾條件：</div>
            <p>1D 日線收盤突破前高 ＋ 1H 波段底底高與突破 ＋ 建議進場價（當根突破 1H 收盤價）與停損防守價（當根突破 1H 最低點）。</p>
        </div>

        <!-- 數據統計與清單 -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-semibold text-slate-200">
                篩選符合標的 
                <span id="total-count" class="ml-2 px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
                    0 檔
                </span>
            </h2>
        </div>

        <!-- 標的清單 Grid -->
        <div id="crypto-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 動態載入區域 -->
        </div>

        <!-- 無標的時顯示 -->
        <div id="empty-state" class="hidden text-center py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700/60">
            <div class="text-4xl mb-3">🔍</div>
            <div class="text-slate-400 text-base font-medium">目前盤面暫無符合雙重突破條件的標的</div>
            <div class="text-slate-500 text-xs mt-1">每 4 小時將由雲端自動重新掃描市場</div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        今天買什麼幣 &copy; 2026. 自動化市場智慧掃描系統
    </footer>

    <!-- 前端腳本：讀取 data.json -->
    <script>
        async function loadCryptoData() {
            try {
                // 加上 timestamp 避免瀏覽器快取
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('無法取得數據');
                
                const data = await response.json();
                
                // 更新時間與總數
                document.getElementById('update-time').innerText = `最後掃描時間：${data.updated_at || '無紀錄'}`;
                document.getElementById('total-count').innerText = `${data.total_count || 0} 檔`;
                
                const grid = document.getElementById('crypto-grid');
                const emptyState = document.getElementById('empty-state');
                grid.innerHTML = '';

                if (!data.stocks || data.stocks.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                data.stocks.forEach(coin => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800/80 border border-slate-700/80 hover:border-yellow-500/50 transition-all rounded-xl p-5 shadow-lg relative overflow-hidden flex flex-col justify-between";
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="text-xl font-bold text-slate-100">${coin.code}</h3>
                                    <span class="text-xs text-slate-400">${coin.name}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${coin.change_pct >= 0 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                                    ${coin.change_pct >= 0 ? '+' : ''}${coin.change_pct}%
                                </span>
                            </div>

                            <div class="grid grid-cols-2 gap-3 py-3 border-y border-slate-700/50 my-3 text-sm">
                                <div>
                                    <div class="text-xs text-slate-400 mb-0.5">最新收盤價</div>
                                    <div class="font-semibold text-slate-200">$${coin.close}</div>
                                </div>
                                <div>
                                    <div class="text-xs text-slate-400 mb-0.5">24H 成交量</div>
                                    <div class="font-semibold text-slate-200">$${(coin.volume / 10000).toFixed(1)}萬</div>
                                </div>
                            </div>

                            <div class="space-y-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700/30">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-emerald-400 font-medium">🎯 建議進場價 (突破 1H 收盤)</span>
                                    <span class="font-bold text-slate-100">$${coin.entry_price}</span>
                                </div>
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-rose-400 font-medium">🛡️ 建議防守價 (突破 1H 最低)</span>
                                    <span class="font-bold text-slate-100">$${coin.exit_price}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('update-time').innerText = '數據載入失敗';
            }
        }

        loadCryptoData();
    </script>
</body>
</html>
