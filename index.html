<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天買什麼幣 - 多週期量化雷達</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- 標題與更新時間 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-700 pb-4 gap-3">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider text-emerald-400">🪙 今天買什麼幣</h1>
                <p class="text-sm text-gray-400 mt-1">山寨幣動能雷達（客觀評分版）</p>
            </div>
            <span id="update-time" class="text-sm bg-gray-800 px-3 py-1.5 rounded-lg text-gray-300 border border-gray-700">載入中...</span>
        </header>

        <!-- 標的卡片總覽區 -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-200 flex items-center gap-2">
                    <span>⚡</span> 掃描潛力標的雷達牆
                </h2>
                <span id="total-count" class="text-xs bg-emerald-900/60 text-emerald-300 px-3 py-1 rounded-full font-semibold">0 檔</span>
            </div>
            
            <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 動態載入卡片 -->
            </div>
        </section>

    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                const globalData = await res.json();
                
                document.getElementById('update-time').innerText = "最後更新: " + (globalData.updated_at || "未知");
                
                const list = globalData.stocks || [];
                document.getElementById('total-count').innerText = list.length + " 檔";

                renderCards(list);
            } catch (e) {
                console.error("載入 data.json 失敗", e);
                document.getElementById('update-time').innerText = "資料載入異常";
            }
        }

        function renderCards(list) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-gray-500 bg-gray-800 rounded-2xl border border-gray-700/60">目前無符合條件標的</div>`;
                return;
            }

            list.forEach(item => {
                // 根據分數給顏色
                let scoreColor = 'bg-gray-700 text-gray-300 border-gray-600';
                if (item.score >= 9) scoreColor = 'bg-rose-900/60 text-rose-300 border-rose-700';
                else if (item.score >= 7) scoreColor = 'bg-emerald-900/60 text-emerald-300 border-emerald-700';
                else if (item.score >= 5) scoreColor = 'bg-teal-900/60 text-teal-300 border-teal-700';

                const indicatorsHtml = (item.indicators || []).map(ind => 
                    `<span class="bg-gray-700/80 text-gray-300 px-2 py-0.5 rounded text-xs font-medium">${ind}</span>`
                ).join('');

                const changeColor = item.change_24h >= 0 ? 'text-emerald-400' : 'text-rose-400';
                const change7dColor = (item.change_7d || 0) >= 0 ? 'text-emerald-400' : 'text-rose-400';

                container.innerHTML += `
                    <div class="bg-gray-800 rounded-2xl p-5 shadow-xl border border-gray-700/60 flex flex-col justify-between hover:border-gray-600 transition">
                        <div>
                            <!-- 卡片頭部 -->
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="text-2xl font-black tracking-wide text-white">${item.code}</h3>
                                    <p class="text-xs text-gray-500">${item.name || ''}</p>
                                    <div class="flex items-center gap-1.5 mt-1">
                                        <span class="text-xs text-gray-400">現價: ${item.current_price}</span>
                                        <span class="text-xs font-semibold ${changeColor}">(${item.change_24h >= 0 ? '+' : ''}${item.change_24h}%)</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="inline-block px-3 py-1 rounded-xl text-lg font-black border ${scoreColor}">
                                        ${item.score} 分
                                    </span>
                                    <p class="text-xs text-gray-400 mt-1 font-semibold">${item.status}</p>
                                </div>
                            </div>

                            <!-- 觸發指標 -->
                            <div class="my-4">
                                <p class="text-xs text-gray-400 mb-1">觸發條件：</p>
                                <div class="flex flex-wrap gap-1.5">${indicatorsHtml || '<span class="text-xs text-gray-500">無明顯訊號</span>'}</div>
                            </div>

                            <!-- 額外資訊 -->
                            <div class="text-xs text-gray-400 space-y-1">
                                <div>7日漲跌：<span class="${change7dColor}">${item.change_7d >= 0 ? '+' : ''}${item.change_7d || 0}%</span></div>
                                <div>24h 成交量：${(item.volume_24h || 0).toLocaleString()}</div>
                            </div>
                        </div>

                        <!-- 底部 -->
                        <div class="border-t border-gray-700/50 pt-3 mt-3 flex justify-between items-center text-xs text-gray-400">
                            <span>量化雷達評估</span>
                            <span class="text-emerald-400 font-medium">✨ 系統運行中</span>
                        </div>
                    </div>
                `;
            });
        }

        // 頁面載入時執行
        loadData();

        // 每 5 分鐘自動刷新一次
        setInterval(loadData, 300000);
    </script>
</body>
</html>
