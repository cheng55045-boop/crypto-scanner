<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天買什麼幣 - 雙系統量化雷達</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- 標題與更新時間 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-700 pb-4 gap-2">
            <div>
                <h1 class="text-3xl font-extrabold tracking-wider text-emerald-400">🪙 今天買什麼幣</h1>
                <p class="text-sm text-gray-400 mt-1">山寨幣雙系統量化雷達（1D 突破結構 + 背離評分系統）</p>
            </div>
            <span id="update-time" class="text-sm bg-gray-800 px-3 py-1.5 rounded-lg text-gray-300 border border-gray-700">載入中...</span>
        </header>

        <!-- 🟢 系統 A 區塊：1D 突破雷達 -->
        <section class="bg-gray-800 rounded-2xl p-5 shadow-xl border border-gray-700/60">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                    <span>🟢</span> 系統 A：1D 結構突破雷達
                </h2>
                <span id="count-a" class="text-xs bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full font-semibold">0 檔</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="p-3">幣種</th>
                            <th class="p-3">最新收盤</th>
                            <th class="p-3">24h 漲跌</th>
                            <th class="p-3">進場價</th>
                            <th class="p-3">防守價 (Exit)</th>
                        </tr>
                    </thead>
                    <tbody id="table-systemA-body">
                        <!-- 動態載入 -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 🔵 系統 B 區塊：背離共振與主力潛伏 -->
        <section class="bg-gray-800 rounded-2xl p-5 shadow-xl border border-gray-700/60">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                    <span>🔵</span> 系統 B：背離共振與主力潛伏雷達
                </h2>
                <span id="count-b" class="text-xs bg-blue-900/60 text-blue-300 px-2.5 py-1 rounded-full font-semibold">0 檔</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="p-3">幣種</th>
                            <th class="p-3">評分 (Score)</th>
                            <th class="p-3">觸發背離指標</th>
                            <th class="p-3">現價 / 進場價</th>
                            <th class="p-3">大防守價</th>
                        </tr>
                    </thead>
                    <tbody id="table-systemB-body">
                        <!-- 動態載入 -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        async function loadData() {
            try {
                let res = await fetch('data.json?t=' + new Date().getTime()); // 避免快取
                let globalData = await res.json();
                
                document.getElementById('update-time').innerText = "最後更新: " + (globalData.updated_at || "未知");
                
                const listA = globalData.system_a || [];
                const listB = globalData.system_b || [];

                document.getElementById('count-a').innerText = listA.length + " 檔";
                document.getElementById('count-b').innerText = listB.length + " 檔";

                renderSystemA(listA);
                renderSystemB(listB);
            } catch (e) {
                console.error("載入 data.json 失敗", e);
                document.getElementById('update-time').innerText = "資料載入異常";
            }
        }

        function renderSystemA(list) {
            const tbody = document.getElementById('table-systemA-body');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">目前無符合 1D 突破條件標的</td></tr>`;
                return;
            }

            list.forEach(item => {
                let colorClass = (item.change_pct || 0) >= 0 ? 'text-emerald-400' : 'text-rose-400';
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700/40 hover:bg-gray-700/30 transition">
                        <td class="p-3 font-bold text-lg">${item.code}</td>
                        <td class="p-3">${item.close}</td>
                        <td class="p-3 ${colorClass}">${item.change_pct}%</td>
                        <td class="p-3 text-emerald-300 font-semibold">${item.entry_price}</td>
                        <td class="p-3 text-rose-300 font-semibold">${item.exit_price}</td>
                    </tr>
                `;
            });
        }

        function renderSystemB(list) {
            const tbody = document.getElementById('table-systemB
