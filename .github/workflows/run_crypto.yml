name: Auto Scan Crypto Altcoins

on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小時自動執行一次
  workflow_dispatch: # 支援手動點擊執行

permissions:
  contents: write # 賦予寫入與推送權限

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests pandas

      - name: 執行加密貨幣策略掃描腳本
        run: |
          python crypto_scanner.py

      - name: 自動提交並推送到 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update crypto scan data [skip ci]" || exit 0
          git push
